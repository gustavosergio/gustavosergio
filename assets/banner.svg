<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Sérgio — Desenvolvedor Full Stack</title>
  <desc id="desc">Banner escuro com gradiente violeta e ciano e linhas de código animadas.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#17112e"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1100" cy="80" r="180" fill="#8b5cf6" opacity=".08"><animate attributeName="r" values="180;210;180" dur="8s" repeatCount="indefinite"/></circle>
  <path d="M60 70H128" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <text x="60" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5" fill="#a5b4fc">CÓDIGO · DESIGN · SOLUÇÕES</text>
  <text x="56" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Gustavo Sérgio</text>
  <text x="60" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#cbd5e1">Desenvolvedor Full Stack</text>
  <rect x="370" y="210" width="3" height="26" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
  <g transform="translate(900 106)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 24L0 48L24 72M100 24L124 48L100 72M76 4L48 92"/>
    <path d="M0 120H124" opacity=".3" stroke-dasharray="24 100"><animate attributeName="stroke-dashoffset" values="124;0" dur="3s" repeatCount="indefinite"/></path>
  </g>
  <rect y="312" width="1200" height="8" fill="url(#accent)"/>
</svg>
